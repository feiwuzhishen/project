server:
  port: 8080

spring:
  application:
    name: finance-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/finance_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: 123456
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: finance-platform-jwt-secret-key-2024
  expiration: 86400000

stock:
  api:
    sina:
      url: https://hq.sinajs.cn/list=
      enabled: true
      timeout: 5000
      retry-times: 3
      retry-interval: 1000
    eastmoney:
      url: https://push2.eastmoney.com/api/qt/stock/get
      enabled: false
  cache:
    enabled: true
    expire-seconds: 30
